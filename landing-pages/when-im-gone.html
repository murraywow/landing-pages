<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When I'm Gone — Music Landing Page</title>
    <meta name="description" content="Landing page for When I'm Gone with streaming links." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <article class="landing-page">
        <img class="cover" src="../assets/when-im-gone-compressed.jpg" alt="Cover art for When I'm Gone" />
        <p class="eyebrow">New single</p>
        <h1>When I'm Gone</h1>

        <div class="actions">
          <a class="button primary" href="https://urlgeni.us/spotify/when-im-gone-playlist" target="_blank">
            <span class="button-icon" aria-hidden="true">
              <img src="../assets/spotify-logo.svg" alt="Spotify logo" />
            </span>
            <span>Listen on Spotify</span>
          </a>
          <a class="button" href="https://music.apple.com/us/song/when-im-gone-feat-maya-lucia/6785386405" target="_blank">
            <span class="button-icon" aria-hidden="true">
              <img src="../assets/apple-music-logo.svg" alt="Apple Music logo" />
            </span>
            <span>Listen on Apple Music</span>
          </a>
        </div>
      </article>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
